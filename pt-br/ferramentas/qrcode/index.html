    <style>
      .qr-skip-link { position: fixed; top: .75rem; left: .75rem; z-index: 1000; padding: .75rem 1rem; color: #111827; background: #d3ff72; font-weight: 700; transform: translateY(-180%); }
      .qr-skip-link:focus { transform: none; outline: 3px solid currentColor; outline-offset: 3px; }
      .qr-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .qr-language-nav { position: fixed; top: 1rem; right: 1rem; z-index: 20; }
      .qr-language-nav a { display: grid; min-width: 2.75rem; min-height: 2.75rem; place-items: center; color: #e5e7eb; border: 1px solid #4b5563; border-radius: 999px; background: #111827; font: 700 .75rem/1 ui-monospace, monospace; text-decoration: none; }
      .qr-language-nav a:focus-visible { outline: 3px solid #d3ff72; outline-offset: 3px; }
      .logo-upload:focus-within { border-color: var(--accent-color); box-shadow: 0 0 0 3px var(--focus-ring); color: var(--text-primary); }
      @media (max-width: 480px) { #main { padding-top: 4rem; } .logo-upload::after { content: "Enviar logotipo"; } }
    </style>

    <a class="qr-skip-link" href="#main">Pular para o criador de QR code</a>
    <nav class="qr-language-nav" aria-label="Idioma"><a href="/qrcode/" lang="en" hreflang="en" aria-label="View in English" data-qr-language="en">EN</a></nav>
    <main id="main">
