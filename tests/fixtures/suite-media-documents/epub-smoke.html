<!doctype html>
<meta charset="utf-8">
<title>Local EPUB Studio smoke test</title>
<link rel="icon" href="data:,">
<body data-result="running">
  <p id="result">running</p>
  <section id="root"></section>
  <script type="module">
    import {
      createZip,
      extractZipEntry,
      mountTool,
      parseEpubNavigation,
      parseEpubPackage,
      parseZipDirectory
    } from '/assets/tools/suite/media-documents.js';

    const body = document.body;
    const result = document.querySelector('#result');
    const root = document.querySelector('#root');
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const waitFor = async (predicate, label, timeout = 8_000) => {
      const started = performance.now();
      while (!predicate()) {
        if (performance.now() - started > timeout) throw new Error(`timed out waiting for ${label}`);
        await new Promise((resolve) => setTimeout(resolve, 25));
      }
    };
    const require = (condition, message) => { if (!condition) throw new Error(message); };

    try {
      const container = `<?xml version="1.0" encoding="UTF-8"?>
        <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
          <rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
        </container>`;
      const opf = `<?xml version="1.0" encoding="UTF-8"?>
        <package version="3.0" unique-identifier="book-id" xmlns="http://www.idpf.org/2007/opf">
          <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
            <dc:identifier id="book-id">urn:uuid:browser-smoke</dc:identifier>
            <dc:title>Browser Smoke Book</dc:title><dc:creator>Local Tester</dc:creator>
            <dc:language>en</dc:language><dc:publisher>Portfolio</dc:publisher><dc:description>Fixture</dc:description>
          </metadata>
          <manifest>
            <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
            <item id="ch1" href="chapter-1.xhtml" media-type="application/xhtml+xml"/>
            <item id="ch2" href="chapter-2.xhtml" media-type="application/xhtml+xml"/>
          </manifest>
          <spine><itemref idref="ch1"/><itemref idref="ch2"/></spine>
        </package>`;
      const nav = `<?xml version="1.0" encoding="UTF-8"?>
        <html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><body>
          <nav epub:type="toc"><h1>Contents</h1><ol>
            <li><a href="chapter-1.xhtml">Chapter One</a></li>
            <li><a href="chapter-2.xhtml">Chapter Two</a></li>
          </ol></nav>
        </body></html>`;
      const chapter = (title, text) => `<html xmlns="http://www.w3.org/1999/xhtml"><head><title>${title}</title></head><body><h1>${title}</h1><p>${text}</p></body></html>`;
      const source = createZip([
        { name: 'mimetype', data: encoder.encode('application/epub+zip') },
        { name: 'META-INF/container.xml', data: encoder.encode(container) },
        { name: 'OEBPS/content.opf', data: encoder.encode(opf) },
        { name: 'OEBPS/nav.xhtml', data: encoder.encode(nav) },
        { name: 'OEBPS/chapter-1.xhtml', data: encoder.encode(chapter('Chapter One', 'First chapter.')) },
        { name: 'OEBPS/chapter-2.xhtml', data: encoder.encode(chapter('Chapter Two', 'Second chapter.')) }
      ]);

      mountTool('epub-studio', { root, pt: false, t: (english) => english });
      const transfer = new DataTransfer();
      transfer.items.add(new File([source], 'fixture.epub', { type: 'application/epub+zip' }));
      root.querySelector('[data-file]').files = transfer.files;
      root.querySelector('[data-open]').click();
      await waitFor(() => root.querySelector('[data-status]').dataset.kind, 'EPUB validation');
      require(root.querySelector('[data-status]').dataset.kind === 'success', root.querySelector('[data-status]').textContent);
      require(root.querySelectorAll('[data-toc-title-index]').length === 2, 'expected two editable spine items');
      require(!root.querySelector('[data-save]').disabled, 'save button did not enable');

      root.querySelector('[data-title]').value = 'Edited Browser Smoke Book';
      const firstTitle = root.querySelector('[data-toc-title-index="0"]');
      firstTitle.value = 'Opening Chapter';
      firstTitle.dispatchEvent(new Event('change', { bubbles: true }));
      root.querySelector('[data-toc-move-index="0"][data-toc-move-delta="1"]').click();
      root.querySelector('[data-save]').click();
      await waitFor(() => !root.querySelector('[data-download]').hidden, 'edited EPUB output');
      require(root.querySelector('[data-status]').dataset.kind === 'success', root.querySelector('[data-status]').textContent);

      let downloaded = null;
      const originalCreateObjectURL = URL.createObjectURL.bind(URL);
      URL.createObjectURL = (blob) => { downloaded = blob; return originalCreateObjectURL(blob); };
      root.querySelector('[data-download]').click();
      URL.createObjectURL = originalCreateObjectURL;
      require(downloaded?.type === 'application/epub+zip', 'download did not produce an EPUB blob');

      const outputBytes = new Uint8Array(await downloaded.arrayBuffer());
      const entries = parseZipDirectory(outputBytes);
      const entryMap = new Map(entries.map((entry) => [entry.name, entry]));
      require(entries[0].name === 'mimetype' && entries[0].method === 0, 'mimetype is not first and stored');
      const editedOpf = decoder.decode(await extractZipEntry(outputBytes, entryMap.get('OEBPS/content.opf')));
      const editedNav = decoder.decode(await extractZipEntry(outputBytes, entryMap.get('OEBPS/nav.xhtml')));
      const packageData = parseEpubPackage(editedOpf);
      const navigation = parseEpubNavigation(editedNav, 'nav');
      require(packageData.metadata.title === 'Edited Browser Smoke Book', 'edited title was not persisted');
      require(packageData.spine.join(',') === 'ch2,ch1', `unexpected spine: ${packageData.spine.join(',')}`);
      require(navigation.entries.map((entry) => entry.title).join(',') === 'Chapter Two,Opening Chapter', 'TOC titles/order were not persisted');
      require(navigation.entries.map((entry) => entry.href).join(',') === 'chapter-2.xhtml,chapter-1.xhtml', 'TOC href order was not persisted');

      body.dataset.result = 'pass';
      result.textContent = `PASS entries=${entries.length} output=${outputBytes.length} spine=${packageData.spine.join('→')} toc=${navigation.entries.map((entry) => entry.title).join('→')}`;
    } catch (error) {
      body.dataset.result = 'fail';
      result.textContent = `FAIL ${error?.message || error}`;
    }
  </script>
</body>
